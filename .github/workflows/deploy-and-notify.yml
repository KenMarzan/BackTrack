name: Build, Push, Deploy, Notify BackTrack

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      image_tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backtrack-agent
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      contents: read
      deployments: write
      statuses: write

    steps:
      - name: Create GitHub Deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: `Deploying ${context.sha.slice(0, 8)}`
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Kubernetes
        id: deploy
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image_tag }}"
          SERVICE="${{ vars.K8S_SERVICE_NAME }}"
          NAMESPACE="${{ vars.K8S_NAMESPACE || 'default' }}"

          kubectl set image deployment/${SERVICE} \
            ${SERVICE}=${IMAGE} \
            -n ${NAMESPACE}

          kubectl rollout status deployment/${SERVICE} \
            -n ${NAMESPACE} \
            --timeout=120s

      - name: Notify BackTrack
        if: success()
        run: |
          curl -f -X POST "${{ secrets.BACKTRACK_AGENT_URL }}/deployment/notify" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.BACKTRACK_API_KEY }}" \
            -d '{
              "service_name": "${{ vars.K8S_SERVICE_NAME }}",
              "image_tag": "${{ needs.build-and-push.outputs.image_tag }}",
              "commit_sha": "${{ github.sha }}",
              "environment": "production",
              "github_deployment_id": "${{ steps.create_deployment.outputs.deployment_id }}"
            }'

      - name: Mark deployment in_progress on GitHub
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'in_progress',
              description: 'BackTrack monitoring window active (5 min)',
            });

      - name: Mark deployment failed on GitHub (deploy step failed)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'failure',
              description: 'Deployment failed before BackTrack monitoring.',
            });
