# Dashboard is available at http://localhost:3847 once the stack is running.
# On Linux, if localhost does not work, use http://127.0.0.1:3847 instead.

services:
  backtrack-dashboard:
    image: zeritzuu/backtrack-dashboard:latest
    build:
      context: ./backtrack-dashboard
      dockerfile: Dockerfile
    ports:
      - "3847:3847"
    # Allows containers to reach host services (e.g. Prometheus at localhost:9091).
    # Required on Linux. Docker Desktop on Mac/Windows handles this automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BACKTRACK_AGENT_URL=http://backtrack-agent:8847
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # ── Notifications (all optional — configure any combination) ────────────
      # Webhook: Slack incoming webhook URL, Discord, or any HTTP endpoint
      - BACKTRACK_WEBHOOK_URL=${BACKTRACK_WEBHOOK_URL:-}
      # Telegram: create a bot via @BotFather and get the chat/channel ID
      - BACKTRACK_TELEGRAM_TOKEN=${BACKTRACK_TELEGRAM_TOKEN:-}
      - BACKTRACK_TELEGRAM_CHAT_ID=${BACKTRACK_TELEGRAM_CHAT_ID:-}
      # Email via Resend (recommended, free tier: 3 000 emails/month — resend.com)
      - BACKTRACK_RESEND_API_KEY=${BACKTRACK_RESEND_API_KEY:-}
      - BACKTRACK_RESEND_FROM=${BACKTRACK_RESEND_FROM:-BackTrack <onboarding@resend.dev>}
      # Email via SMTP — pre-configured out of the box, override with your own if needed
      - BACKTRACK_SMTP_HOST=${BACKTRACK_SMTP_HOST:-smtp.gmail.com}
      - BACKTRACK_SMTP_PORT=${BACKTRACK_SMTP_PORT:-587}
      - BACKTRACK_SMTP_USER=${BACKTRACK_SMTP_USER:-marzanken232@gmail.com}
      - BACKTRACK_SMTP_PASS=${BACKTRACK_SMTP_PASS:-eazb hsmi xnme wmyh}
      - BACKTRACK_SMTP_FROM=${BACKTRACK_SMTP_FROM:-marzanken232@gmail.com}
      - BACKTRACK_SMTP_TO=${BACKTRACK_SMTP_TO:-}
      # ── Security ─────────────────────────────────────────────────────────────
      - BACKTRACK_API_SECRET=${BACKTRACK_API_SECRET:-}
      # Kubernetes mode: uncomment after enabling the kube volume above.
      - KUBECONFIG=/root/.kube/config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backtrack-data:/app/.backtrack
      - ${KUBE_DIR:-~/.kube}:/root/.kube:ro
    networks:
      - default
      - kind
    depends_on:
      backtrack-agent:
        condition: service_healthy

  backtrack-agent:
    image: zeritzuu/backtrack-agent:latest
    build:
      context: ./backtrack-agent
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BACKTRACK_TARGET=${BACKTRACK_TARGET:-}
      - BACKTRACK_IMAGE_TAG=${BACKTRACK_IMAGE_TAG:-latest}
      - BACKTRACK_MODE=${BACKTRACK_MODE:-docker}
      - BACKTRACK_K8S_NAMESPACE=${BACKTRACK_K8S_NAMESPACE:-default}
      - BACKTRACK_SCRAPE_INTERVAL=${BACKTRACK_SCRAPE_INTERVAL:-10}
      - BACKTRACK_STABLE_SECONDS=${BACKTRACK_STABLE_SECONDS:-120}
      - BACKTRACK_WINDOW_SECONDS=${BACKTRACK_WINDOW_SECONDS:-10}
      - BACKTRACK_BASELINE_WINDOWS=${BACKTRACK_BASELINE_WINDOWS:-3}
      - BACKTRACK_CORPUS_SIZE=${BACKTRACK_CORPUS_SIZE:-50}
      - BACKTRACK_ROLLBACK_ENABLED=${BACKTRACK_ROLLBACK_ENABLED:-true}
      - BACKTRACK_DATA_DIR=/data
      # Dashboard URL used by the agent to sync MTTR entries after auto-rollback
      - BACKTRACK_DASHBOARD_URL=http://backtrack-dashboard:3847
      # Shared secret — must match BACKTRACK_API_SECRET on the dashboard
      - BACKTRACK_API_SECRET=${BACKTRACK_API_SECRET:-}
      # Allow CORS from the dashboard container
      - BACKTRACK_ALLOW_ORIGINS=http://localhost:3847,http://backtrack-dashboard:3847
      # Kubernetes mode: uncomment after enabling the kube volume above.
      - KUBECONFIG=/root/.kube/config
    volumes:
      - backtrack-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KUBE_DIR:-~/.kube}:/root/.kube:ro
    networks:
      - default
      - kind
    ports:
      - "8847:8847"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8847/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

# Uncomment if using kind cluster:
networks:
  kind:
    external: true

volumes:
  backtrack-data:
