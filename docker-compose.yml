services:
  backtrack-dashboard:
    image: zeritzuu/backtrack-dashboard:latest
    build:
      context: ./backtrack-dashboard
      dockerfile: Dockerfile
    ports:
      - "3847:3847"
    # Allows containers to reach the host as "host.docker.internal".
    # On Linux this is required (Docker Desktop on Mac/Windows defines it automatically).
    # host-gateway resolves to the host machine on all platforms with Docker Engine 20.10+.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BACKTRACK_AGENT_URL=http://backtrack-agent:8847
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Tells kubectl which config file to load from the mounted .kube directory.
      # Set KUBECONFIG_FILE=config-docker in your .env for the patched Docker-safe copy.
      - KUBECONFIG=/root/.kube/${KUBECONFIG_FILE:-config}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backtrack-data:/.backtrack
      # Mounts your entire .kube directory so kubectl can reach the cluster.
      # KUBE_DIR defaults to ~/.kube (Linux/Mac). Windows users: set KUBE_DIR=C:/Users/<you>/.kube
      - ${KUBE_DIR:-~/.kube}:/root/.kube:ro
    depends_on:
      backtrack-agent:
        condition: service_healthy

  backtrack-agent:
    image: zeritzuu/backtrack-agent:latest
    build:
      context: ./backtrack-agent
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BACKTRACK_TARGET=${BACKTRACK_TARGET:-}
      - BACKTRACK_IMAGE_TAG=${BACKTRACK_IMAGE_TAG:-unknown}
      - BACKTRACK_MODE=${BACKTRACK_MODE:-}
      - BACKTRACK_K8S_NAMESPACE=${BACKTRACK_K8S_NAMESPACE:-default}
      - BACKTRACK_K8S_LABEL_SELECTOR=${BACKTRACK_K8S_LABEL_SELECTOR:-}
      - BACKTRACK_SCRAPE_INTERVAL=${BACKTRACK_SCRAPE_INTERVAL:-10}
      - BACKTRACK_STABLE_SECONDS=${BACKTRACK_STABLE_SECONDS:-600}
      - BACKTRACK_ROLLBACK_ENABLED=${BACKTRACK_ROLLBACK_ENABLED:-true}
      - BACKTRACK_ROLLBACK_COOLDOWN=${BACKTRACK_ROLLBACK_COOLDOWN:-120}
      - BACKTRACK_TSD_IQR_MULTIPLIER=${BACKTRACK_TSD_IQR_MULTIPLIER:-3.0}
      - BACKTRACK_LSI_SCORE_MULTIPLIER=${BACKTRACK_LSI_SCORE_MULTIPLIER:-2.0}
      - BACKTRACK_CORPUS_SIZE=${BACKTRACK_CORPUS_SIZE:-200}
      - BACKTRACK_BASELINE_WINDOWS=${BACKTRACK_BASELINE_WINDOWS:-10}
      - BACKTRACK_WINDOW_SECONDS=${BACKTRACK_WINDOW_SECONDS:-30}
      - BACKTRACK_SVD_SIMILARITY_THRESHOLD=${BACKTRACK_SVD_SIMILARITY_THRESHOLD:-0.55}
      - BACKTRACK_DATA_DIR=${BACKTRACK_DATA_DIR:-/data}
      - KUBECONFIG=/root/.kube/${KUBECONFIG_FILE:-config}
    volumes:
      - backtrack-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KUBE_DIR:-~/.kube}:/root/.kube:ro
    ports:
      - "8847:8847"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8847/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  backtrack-data:
