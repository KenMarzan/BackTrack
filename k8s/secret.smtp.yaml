---
# Pre-configured SMTP sender credentials for BackTrack email notifications.
# Apply once, then set your recipient address via the dashboard Notifications panel.
#
#   kubectl apply -f k8s/secret.smtp.yaml
#
# Then reference in your Deployment:
#   envFrom:
#     - secretRef:
#         name: backtrack-smtp
apiVersion: v1
kind: Secret
metadata:
  name: backtrack-smtp
  namespace: backtrack
type: Opaque
stringData:
  BACKTRACK_SMTP_HOST: smtp.gmail.com
  BACKTRACK_SMTP_PORT: "587"
  BACKTRACK_SMTP_USER: marzanken232@gmail.com
  BACKTRACK_SMTP_PASS: "eazb hsmi xnme wmyh"
  BACKTRACK_SMTP_FROM: marzanken232@gmail.com
